<style>
/* Layout: one 9:16 sheet of lacquered petrol-blue paper, framed by two silver hairlines and centered on a darker stage.
   Every size derives from the sheet width (1 unit = 1px of a 1080px-wide export), so it keeps the 1080x1920 proportions at any screen size. */
:root{
  --stage:#021419;
  --petrol-deep:#041d25;
  --petrol:#0a3641;
  --petrol-lift:#14596a;
  --silver-lo:#8c98a1;
  --silver:#c8d0d7;
  --silver-hi:#f5f8fa;
  --pearl:#ecebe4;
  --serif:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --script:"Pinyon Script","Snell Roundhand","Segoe Script","Brush Script MT",cursive;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}

html,body{height:100%}
body{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  place-items:center;
  padding-block:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:var(--stage);
  color:var(--pearl);
  font-family:var(--serif);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

.card{
  --u:calc(100cqw / 1080);
  position:absolute;
  inset:0;
  z-index:2;
  isolation:isolate;
  overflow:hidden;
  container-type:inline-size;
  transform:scale(.34);
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.016) 0 1px, transparent 1px 5px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.05) 0 1px, transparent 1px 5px),
    radial-gradient(120% 55% at 50% -5%, rgba(26,110,128,.55), transparent 65%),
    radial-gradient(100% 50% at 50% 105%, rgba(20,89,106,.45), transparent 70%),
    linear-gradient(180deg, var(--petrol) 0%, var(--petrol-deep) 100%);
  box-shadow:0 40px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(200,208,215,.10);
}

/* scene: holds the envelope and the card; same 9:16 box as the card */
.scene{
  position:relative;
  isolation:isolate;
  width:min(100%, calc((100svh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 9 / 16));
  aspect-ratio:9 / 16;
  container-type:inline-size;
  animation:fade 1s ease-out backwards;
}

/* envelope: back (z1) < card (z2) < pocket (z3) < flap (z4) */
.intro{position:absolute; inset:0; display:grid; place-items:center; pointer-events:none}
.env{
  position:relative;
  width:100%;
  aspect-ratio:3 / 2;
  cursor:pointer;
  pointer-events:auto;
  outline:none;
  -webkit-tap-highlight-color:transparent;
}
.env:focus-visible{outline:2px solid var(--silver); outline-offset:8px}
.env > svg,.env-shadow{position:absolute; display:block}
.env-back,.env-pocket{inset:0; width:100%; height:100%}
.env-back{z-index:1}
.env-pocket{z-index:3}
.env-shadow{
  z-index:0;
  left:6%;
  right:6%;
  bottom:-7%;
  height:16%;
  background:radial-gradient(ellipse at center, rgba(0,0,0,.6), transparent 70%);
  filter:blur(8px);
}
.env-flap{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:58%;
  z-index:4;
  transform-origin:50% 0;
  transform:perspective(1200px) rotateX(0deg);
  transform-style:preserve-3d;
}
.face{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}
.f-back{transform:rotateX(180deg)}

.seal{
  position:absolute;
  z-index:5;
  left:50%;
  top:58%;
  width:15%;
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;
  display:grid;
  place-items:center;
  padding-bottom:.06em;
  font-family:var(--script);
  font-size:11cqw;
  line-height:1;
  color:#0a3a46;
  background:radial-gradient(circle at 35% 28%, #fbfdfe 0%, #c8d0d7 45%, #8c98a1 100%);
  box-shadow:0 3px 10px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.4), inset 0 0 0 6px rgba(64,82,94,.22);
  transition:opacity .35s ease, transform .35s ease;
}

.hint{
  position:absolute;
  z-index:6;
  left:0;
  right:0;
  top:100%;
  margin:0;
  padding-top:6cqw;
  text-align:center;
  font-size:3.7cqw;
  font-weight:500;
  letter-spacing:.34em;
  text-indent:.34em;
  text-transform:uppercase;
  color:var(--silver);
  animation:pulse 2.6s ease-in-out infinite;
}

/* opening sequence */
.open .env-flap{
  transform:perspective(1200px) rotateX(180deg);
  z-index:1;
  transition:transform .9s cubic-bezier(.5,0,.25,1), z-index 0s linear .45s;
}
.open .seal{opacity:0; transform:translate(-50%,-50%) scale(.6)}
.open .hint{animation:none; opacity:0; transition:opacity .3s}
.open .card{animation:cardOut 2.8s linear .75s both}
.open .env{animation:envOut 1.1s ease-in 2s forwards; pointer-events:none}

/* card content waits until the card is out of the envelope */
.scene:not(.shown) .card *{animation-play-state:paused}

/* fine grain over the whole sheet */
.card::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  opacity:.4;
  mix-blend-mode:soft-light;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size:240px 240px;
}

/* ornaments: frame, corners, rings */
.orn{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
}
.draw{stroke-dasharray:1; stroke-dashoffset:0; animation:draw 2.2s ease-out var(--d,0s) backwards}
.fade{animation:fade 1.6s ease-out var(--d,0s) backwards}
.tw{transform-box:fill-box; transform-origin:center; animation:twinkle 5s ease-in-out var(--d,0s) infinite}
.spin{transform-box:fill-box; transform-origin:center; animation:spin 180s linear infinite}

/* slow light sweep, like light crossing metallic foil */
.sheen{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  mix-blend-mode:screen;
  background:linear-gradient(105deg, transparent 38%, rgba(255,255,255,.07) 50%, transparent 62%);
  transform:translateX(-120%);
  animation:sheen 10s ease-in-out 3.5s infinite;
}

/* content column */
.content{
  position:absolute;
  inset:0;
  z-index:3;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:calc(var(--u) * 190) calc(var(--u) * 110);
  text-align:center;
}

.top{display:flex; flex-direction:column; align-items:center; gap:calc(var(--u) * 26)}

.eyebrow{
  margin:0;
  max-width:calc(var(--u) * 820);
  font-weight:500;
  font-size:calc(var(--u) * 31);
  line-height:1.35;
  letter-spacing:.28em;
  padding-left:.28em;
  color:var(--silver);
  text-wrap:balance;
}

.sep{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:calc(var(--u) * 14);
  width:calc(var(--u) * 320);
}
.sep::before,.sep::after{
  content:"";
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(200,208,215,.6));
}
.sep::after{transform:scaleX(-1)}
.sep i{
  width:calc(var(--u) * 9);
  height:calc(var(--u) * 9);
  border:1px solid var(--silver);
  transform:rotate(45deg);
}

.title{
  margin:0;
  font-weight:500;
  font-size:calc(var(--u) * 68);
  line-height:1.1;
  letter-spacing:.2em;
  padding-left:.2em;
}

/* metallic silver type */
.metal{
  color:var(--silver);
  background-image:linear-gradient(100deg, var(--silver-lo) 0%, #e4eaef 16%, var(--silver-hi) 28%, #aab5be 44%, var(--silver-lo) 56%, #e4eaef 72%, var(--silver-hi) 84%, #aab5be 100%);
  background-size:220% 100%;
  background-position:0 0;
  background-repeat:no-repeat;
  -webkit-background-clip:text;
  background-clip:text;
}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .metal{-webkit-text-fill-color:transparent}
}

.name{
  margin:-.18em -.22em;
  padding:.18em .22em;
  width:max-content;
  font-family:var(--script);
  font-weight:400;
  font-size:calc(var(--u) * 290);
  line-height:.95;
  filter:drop-shadow(0 0 calc(var(--u) * 18) rgba(200,215,225,.22));
  animation:reveal 2.3s cubic-bezier(.55,.1,.25,1) 1s backwards, shimmer 9s ease-in-out 3.3s infinite alternate;
}

.message{
  margin:0;
  font-style:italic;
  font-weight:400;
  font-size:calc(var(--u) * 48);
  line-height:1.45;
  color:var(--pearl);
  opacity:.92;
}
.message span{display:block}

.info{display:flex; flex-direction:column; align-items:center; gap:calc(var(--u) * 26)}
.item{display:flex; flex-direction:column; align-items:center; gap:calc(var(--u) * 10)}
.item svg{
  width:calc(var(--u) * 58);
  height:calc(var(--u) * 58);
  fill:none;
  stroke:var(--silver);
  stroke-width:1.5;
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:drop-shadow(0 0 calc(var(--u) * 8) rgba(200,215,225,.3));
}
.label{
  margin:0;
  font-weight:500;
  font-size:calc(var(--u) * 29);
  letter-spacing:.42em;
  padding-left:.42em;
  color:var(--silver);
}
.value{
  margin:0;
  max-width:calc(var(--u) * 820);
  font-weight:500;
  font-size:calc(var(--u) * 58);
  line-height:1.1;
  color:var(--pearl);
  text-wrap:balance;
}

.foot{display:flex; flex-direction:column; align-items:center; gap:calc(var(--u) * 8)}
.thanks{
  margin:-.2em -.25em;
  padding:.2em .25em;
  font-family:var(--script);
  font-weight:400;
  font-size:calc(var(--u) * 118);
  line-height:1;
}
.flourish{
  width:calc(var(--u) * 520);
  height:calc(var(--u) * 56);
  overflow:visible;
}

/* entrance: a calm top-to-bottom sequence */
.rise{animation:rise 1.4s cubic-bezier(.2,.7,.2,1) var(--d,0s) backwards}
.metal.rise{
  animation:
    rise 1.4s cubic-bezier(.2,.7,.2,1) var(--d,0s) backwards,
    shimmer 9s ease-in-out calc(var(--d,0s) + 1.4s) infinite alternate;
}

@keyframes rise{
  from{opacity:0; transform:translateY(calc(var(--u) * 26)); filter:blur(calc(var(--u) * 5))}
}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes reveal{
  from{clip-path:inset(-10% 100% -10% -10%)}
  to{clip-path:inset(-10% -10% -10% -10%)}
}
@keyframes shimmer{to{background-position:100% 0}}
@keyframes twinkle{
  0%,100%{opacity:.35; transform:scale(.7) rotate(0deg)}
  50%{opacity:1; transform:scale(1.12) rotate(45deg)}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sheen{
  0%{transform:translateX(-120%)}
  45%,100%{transform:translateX(120%)}
}

@keyframes pulse{0%,100%{opacity:.45} 50%{opacity:1}}
@keyframes cardOut{
  0%{transform:translateY(0) scale(.34); z-index:2; animation-timing-function:cubic-bezier(.3,.1,.3,1)}
  28%{transform:translateY(-30%) scale(.36); z-index:2}
  28.1%{transform:translateY(-30%) scale(.36); z-index:5; animation-timing-function:cubic-bezier(.45,0,.15,1)}
  100%{transform:translateY(0) scale(1); z-index:5}
}
@keyframes envOut{to{transform:translateY(22%); opacity:0}}

/* reduced motion: keep the envelope opening, drop the endlessly repeating effects */
@media (prefers-reduced-motion:reduce){
  .tw,.spin,.sheen,.hint{animation:none}
  .hint{opacity:.85}
  .metal.rise{animation:rise 1.4s cubic-bezier(.2,.7,.2,1) var(--d,0s) backwards}
  .name{animation:reveal 2.3s cubic-bezier(.55,.1,.25,1) 1s backwards}
  .open .hint{opacity:0}
}
</style>

</head>
<body>
<div class="scene" id="scene">

  <div class="intro">
    <div class="env" id="env" role="button" tabindex="0" aria-label="Abrir la invitación">
      <div class="env-shadow" aria-hidden="true"></div>

      <svg class="env-back" viewBox="0 0 600 400" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="gBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b3a46"/><stop offset="1" stop-color="#062a33"/></linearGradient>
          <linearGradient id="gPocket" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14596a"/><stop offset="1" stop-color="#0a3a46"/></linearGradient>
          <linearGradient id="gFlap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b6e7f"/><stop offset="1" stop-color="#10495a"/></linearGradient>
          <linearGradient id="gLining" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0d3c48"/><stop offset="1" stop-color="#062a33"/></linearGradient>
        </defs>
        <rect width="600" height="400" fill="url(#gBack)"/>
        <rect x=".5" y=".5" width="599" height="399" fill="none" stroke="#c8d0d7" stroke-opacity=".35" vector-effect="non-scaling-stroke"/>
      </svg>

      <svg class="env-pocket" viewBox="0 0 600 400" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <path d="M0 0 L300 232 L600 0 V400 H0 Z" fill="url(#gPocket)"/>
        <path d="M0 400 L262 222 M600 400 L338 222" fill="none" stroke="#c8d0d7" stroke-opacity=".18" vector-effect="non-scaling-stroke"/>
        <path d="M0 0 L300 232 L600 0" fill="none" stroke="#dfe6eb" stroke-opacity=".55" vector-effect="non-scaling-stroke"/>
        <rect x=".5" y=".5" width="599" height="399" fill="none" stroke="#c8d0d7" stroke-opacity=".35" vector-effect="non-scaling-stroke"/>
      </svg>

      <div class="env-flap" aria-hidden="true">
        <svg class="face f-front" viewBox="0 0 600 232" preserveAspectRatio="none" focusable="false">
          <path d="M0 0 H600 L300 232 Z" fill="url(#gFlap)"/>
          <path d="M0 0 L300 232 L600 0" fill="none" stroke="#e6ecf0" stroke-opacity=".75" vector-effect="non-scaling-stroke"/>
        </svg>
        <svg class="face f-back" viewBox="0 0 600 232" preserveAspectRatio="none" focusable="false">
          <path d="M0 232 H600 L300 0 Z" fill="url(#gLining)"/>
          <path d="M60 232 L300 40 L540 232" fill="none" stroke="#c8d0d7" stroke-opacity=".22" vector-effect="non-scaling-stroke"/>
        </svg>
      </div>

      <div class="seal" aria-hidden="true">Y</div>
      <p class="hint">Toca para abrir</p>
    </div>
  </div>

<main class="card" aria-label="Invitación al cumpleaños de Yumira">

  <svg class="orn" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="sg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1080" y2="1920">
        <stop offset="0" stop-color="#8e9aa3"/>
        <stop offset=".25" stop-color="#eef2f5"/>
        <stop offset=".5" stop-color="#aab5be"/>
        <stop offset=".75" stop-color="#f4f7f9"/>
        <stop offset="1" stop-color="#8e9aa3"/>
      </linearGradient>
      <g id="corner" fill="none" stroke="url(#sg)" stroke-linecap="round">
        <path d="M84 236 C84 150 150 84 236 84" stroke-width="1.8"/>
        <path d="M84 176 C84 126 126 84 176 84" stroke-width="1.2" opacity=".8"/>
        <path d="M84 70 L98 84 L84 98 L70 84 Z" stroke-width="1.4"/>
        <circle cx="236" cy="84" r="3" fill="#dfe6eb" stroke="none"/>
        <circle cx="84" cy="236" r="3" fill="#dfe6eb" stroke="none"/>
      </g>
    </defs>

    <!-- faint geometry behind the content -->
    <circle cx="540" cy="960" r="400" fill="none" stroke="#c8d0d7" stroke-opacity=".07" stroke-width="1"/>
    <circle class="spin" cx="540" cy="960" r="430" fill="none" stroke="#c8d0d7" stroke-opacity=".14" stroke-width="1.2" stroke-dasharray="2 12"/>

    <!-- double silver frame -->
    <rect class="draw" x="44" y="44" width="992" height="1832" fill="none" stroke="url(#sg)" stroke-width="2.4" pathLength="1"/>
    <rect class="draw" style="--d:.4s" x="62" y="62" width="956" height="1796" fill="none" stroke="url(#sg)" stroke-width="1" opacity=".55" pathLength="1"/>

    <!-- mid-edge lozenges -->
    <path class="fade" style="--d:1.6s" d="M540 28 L556 44 L540 60 L524 44 Z" fill="none" stroke="url(#sg)" stroke-width="1.5"/>
    <path class="fade" style="--d:1.6s" d="M540 1860 L556 1876 L540 1892 L524 1876 Z" fill="none" stroke="url(#sg)" stroke-width="1.5"/>

    <!-- corner curves -->
    <use class="fade" style="--d:1.2s" href="#corner"/>
    <use class="fade" style="--d:1.35s" href="#corner" transform="translate(1080 0) scale(-1 1)"/>
    <use class="fade" style="--d:1.5s" href="#corner" transform="translate(0 1920) scale(1 -1)"/>
    <use class="fade" style="--d:1.65s" href="#corner" transform="translate(1080 1920) scale(-1 -1)"/>

    <!-- corner sparkles -->
    <g transform="translate(150 150) scale(16)"><path class="tw" style="--d:0s" fill="#eef3f6" d="M0 -1 C.1 -.3 .3 -.1 1 0 C.3 .1 .1 .3 0 1 C-.1 .3 -.3 .1 -1 0 C-.3 -.1 -.1 -.3 0 -1Z"/></g>
    <g transform="translate(930 150) scale(16)"><path class="tw" style="--d:1.2s" fill="#eef3f6" d="M0 -1 C.1 -.3 .3 -.1 1 0 C.3 .1 .1 .3 0 1 C-.1 .3 -.3 .1 -1 0 C-.3 -.1 -.1 -.3 0 -1Z"/></g>
    <g transform="translate(150 1770) scale(16)"><path class="tw" style="--d:2.4s" fill="#eef3f6" d="M0 -1 C.1 -.3 .3 -.1 1 0 C.3 .1 .1 .3 0 1 C-.1 .3 -.3 .1 -1 0 C-.3 -.1 -.1 -.3 0 -1Z"/></g>
    <g transform="translate(930 1770) scale(16)"><path class="tw" style="--d:3.6s" fill="#eef3f6" d="M0 -1 C.1 -.3 .3 -.1 1 0 C.3 .1 .1 .3 0 1 C-.1 .3 -.3 .1 -1 0 C-.3 -.1 -.1 -.3 0 -1Z"/></g>
  </svg>

  <div class="sheen" aria-hidden="true"></div>

  <div class="content">

    <header class="top">
      <p class="eyebrow rise" style="--d:.3s">ESTÁS INVITADO(A) A CELEBRAR</p>
      <div class="sep rise" style="--d:.5s" aria-hidden="true"><i></i></div>
      <p class="title metal rise" style="--d:.7s">CUMPLEAÑOS DE</p>
    </header>

    <h1 class="name metal">Yumira</h1>

    <p class="message rise" style="--d:2s">
      <span>Será una noche especial</span>
      <span>y me encantaría compartirla contigo.</span>
    </p>

    <section class="info" aria-label="Detalles del evento">

      <div class="item rise" style="--d:2.4s">
        <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <rect class="draw" style="--d:2.4s" x="8" y="11" width="32" height="29" rx="3" pathLength="1"/>
          <path class="draw" style="--d:2.5s" d="M8 20 H40" pathLength="1"/>
          <path class="draw" style="--d:2.6s" d="M16 7 V14 M32 7 V14" pathLength="1"/>
          <path class="draw" style="--d:2.8s" d="M16 27 H18 M23 27 H25 M30 27 H32 M16 33 H18 M23 33 H25" pathLength="1"/>

<script>
(function () {
  var scene = document.getElementById('scene');
  var env = document.getElementById('env');
  var started = false;

  function open() {
    if (started) return;
    started = true;
    scene.classList.add('open');
    setTimeout(function () { scene.classList.add('shown'); }, 2600);
    setTimeout(function () { env.style.display = 'none'; }, 3400);
  }

  document.addEventListener('click', open);
  env.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  });
  setTimeout(open, 9000);
})();
</script>
